model_parameters:
  onnx_model: "best_raw.onnx"
  march: "bayes-e"

input_parameters:
  input_type_rt: "nv12"
  input_type_train: "rgb"
  input_layout_train: "NCHW"
  norm_type: "data_scale"
  scale_value: 0.003921568627451

calibration_parameters:
  cal_data_dir: "./cal_data_uint8"
  cal_data_type: "uint8"
  calibration_type: "default"

compiler_parameters:
  optimize_level: "O3"
  debug: False
